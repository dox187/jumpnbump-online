# Portainer web editor stack without a build step.
#
# Build the image on the host first, in a clone of this repository:
#     podman build -t jumpnbump-online:latest .      # or: docker build ...
#
# Under Podman the locally built image is called localhost/jumpnbump-online:latest;
# under Docker change it to jumpnbump-online:latest.
#
# The container joins the reverse proxy's network, so Nginx Proxy Manager can forward to
# http://jumpnbump-online:8080 (enable Websockets Support). Change the network name if yours differs.
services:
  jumpnbump-online:
    image: localhost/jumpnbump-online:latest
    container_name: jumpnbump-online
    init: true
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Behind a reverse proxy every player arrives from the proxy's address; "1" makes the
      # per-player limits use X-Forwarded-For. Set it to "0" if players connect to this port directly.
      TRUST_PROXY: "1"
    networks:
      - default
      - proxy
    restart: unless-stopped
    # Podman's Docker-compatible API re-splits healthcheck arguments on spaces; keep them space-free.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  proxy:
    name: your-reverse-proxy-network
    external: true
